name: Deploy dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate dashboard data/config
        run: |
          test -s data/listings.json
          test -s data/config.json
          python - <<'PY'
          import json
          c=json.load(open('data/config.json',encoding='utf-8'))
          assert c['financial']['monthly_budget_eur'] == 4300.0
          assert c['financial']['cash_budget_eur'] == 250000.0
          assert c['commute']['max_minutes'] == 35
          print('Dashboard config sanity PASS')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test deployed dashboard
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # GitHub Pages propagation can lag the deploy API by more than 10 seconds.
          # Use a cache-busting query and a longer retry window before declaring failure.
          stamp="$(date +%s)"
          sleep 8
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "$PAGE_URL?v=$stamp" -o /tmp/index.html
          grep -q "House Master" /tmp/index.html
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/data/config.json?v=$stamp" -o /tmp/config.json
          grep -q '"monthly_budget_eur": 4300.0' /tmp/config.json
          curl -fsSL --retry 12 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/data/listings.json?v=$stamp" -o /tmp/listings.json
          grep -q 'property_id' /tmp/listings.json
          echo "Dashboard deployment smoke test PASS: $PAGE_URL"
