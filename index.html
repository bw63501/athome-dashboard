<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>House Master — Decision Dashboard</title>
<style>
:root{--bg:#171d27;--grid:#202938;--card:#263143;--open:#2b374b;--line:#3b4960;--text:#eef1f5;--muted:#aeb8c8;--gold:#d0ad58;--good:#76c58f;--bad:#dc7d79;--warn:#e0aa58}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
header{padding:22px 16px 14px;border-bottom:1px solid var(--line);background:#171d27}main{max-width:1120px;margin:auto;padding:14px 16px 34px}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}h1{font:700 29px Georgia,serif;margin:0 0 5px}.sub,.meta,.small{color:var(--muted);font-size:12px}.rules,.market,.kpi,.property{background:var(--card);border:1px solid var(--line);border-radius:16px}.rules,.market{padding:12px 14px;margin-bottom:11px;font-size:12px}.rules{border-color:#8a733a}.rules b,.market a{color:var(--gold)}.market a{text-decoration:none;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}.kpi{padding:12px;min-width:0}.kpi .n{font:700 23px ui-monospace,monospace;color:var(--gold);overflow-wrap:anywhere}.kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:11px;background:var(--card);color:var(--muted);border:1px solid var(--line);border-radius:11px;font:12px ui-monospace,monospace}.tab.active{background:var(--gold);color:#171d27;border-color:#a8873f}.filters{display:grid;grid-template-columns:2fr repeat(3,minmax(130px,1fr));gap:9px;margin-bottom:12px}.filters input,.filters select{width:100%;min-width:0;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit}
.list{display:grid;gap:12px}.property{overflow:hidden}.property[open]{background:var(--open);border-color:#7f6b3d}.property summary{list-style:none;cursor:pointer;padding:16px}.property summary::-webkit-details-marker{display:none}.row{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(120px,.6fr);gap:14px;align-items:center}.rank{width:40px;height:40px;border:1px solid #88723d;border-radius:50%;display:grid;place-items:center;color:var(--gold);font:700 13px ui-monospace,monospace}.name{font:700 21px Georgia,serif;line-height:1.18;overflow-wrap:anywhere}.score{color:var(--gold);font:700 13px ui-monospace,monospace;margin-top:5px}.price{text-align:right;min-width:0;overflow-wrap:anywhere}.asking{font:700 20px ui-monospace,monospace;white-space:normal;overflow-wrap:anywhere}.monthly{font-size:12px;color:var(--muted);margin-top:3px}.expand{font-size:11px;color:var(--muted);margin-top:5px}.property[open] .expand:after{content:" ▲"}.property:not([open]) .expand:after{content:" ▼"}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font:700 10px ui-monospace,monospace}.good{color:var(--good);border-color:rgba(118,197,143,.55)}.bad{color:var(--bad);border-color:rgba(220,125,121,.55)}.review{color:var(--warn);border-color:rgba(224,170,88,.55)}
.panel{border-top:1px dashed var(--line);padding:15px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid var(--line);background:rgba(23,29,39,.24);border-radius:13px;padding:13px;min-width:0}.full{grid-column:1/-1}.section h3{margin:0 0 10px;color:var(--gold);font:700 11px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,auto);gap:7px 12px;font-size:13px}.label{color:var(--muted)}.value{text-align:right;overflow-wrap:anywhere;max-width:50vw}.note{line-height:1.55;overflow-wrap:anywhere}.reason{padding:11px;border-radius:10px;border:1px solid rgba(224,170,88,.28);background:rgba(224,170,88,.08);font-size:13px;overflow-wrap:anywhere}.reason.badbox{border-color:rgba(220,125,121,.35);background:rgba(220,125,121,.08)}.link{display:block;padding:12px;border-radius:11px;background:var(--gold);color:#171d27;text-decoration:none;font-weight:800;text-align:center}.empty{padding:20px;text-align:center;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px}
@media(max-width:760px){main{padding:12px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.row{grid-template-columns:42px minmax(0,1fr);gap:10px}.price{grid-column:2;text-align:left}.asking{font-size:17px}.name{font-size:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.value{max-width:55vw}.tabs{gap:7px}.tab{padding:10px 6px;font-size:11px}}
</style>
</head>
<body>
<header>
<div class="eyebrow">Dossier — Luksemburg</div>
<h1>House Master</h1>
<div class="sub">atHome + Immotop · owner feedback · Nexvia · decision scorecard · pełne dane po rozwinięciu oferty</div>
</header>
<main>
<div id="rules" class="rules"><b>Ładowanie konfiguracji…</b></div>
<div class="market"><a href="https://www.athome.lu/" target="_blank" rel="noopener">atHome</a> · <a href="https://www.immotop.lu/" target="_blank" rel="noopener">Immotop</a> · kliknij ofertę, aby rozwinąć pełne dane</div>
<div id="kpis" class="kpis"></div>
<div class="tabs"><button id="topTab" class="tab active">1 · TOP</button><button id="rejectTab" class="tab">2 · ODRZUCONE / DUPLIKATY</button><button id="baselineTab" class="tab">3 · HOUSE MASTER 37</button></div>
<div class="filters">
<input id="q" placeholder="Szukaj lokalizacji / tytułu / ID…">
<select id="source"><option value="ALL">Źródło: wszystkie</option><option value="athome">atHome</option><option value="immotop">Immotop</option><option value="house_master_37">House Master 37</option></select>
<select id="energy"><option value="ALL">Energia: wszystkie</option><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option></select>
<select id="sort"><option value="score">Score ↓</option><option value="price">Cena ↑</option><option value="value">All-in €/m² ↑</option><option value="monthly">Rata + charges ↑</option><option value="cash">Gotówka potrzebna ↑</option></select>
</div>
<div id="loading" class="empty">Ładowanie danych…</div><div id="cards" class="list"></div>
</main>
<script>
let CONFIG=null,data=[],baselineData=[],tab='top',MONTHLY_LIMIT=Infinity,CASH_LIMIT=Infinity,COMMUTE_LIMIT=Infinity,UNDER_CONSTRUCTION_PENALTY=0.20;
const euro=n=>n==null?'—':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n));
const num=n=>n==null?'—':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yes=v=>v===true||['yes','oui','true'].includes(String(v).toLowerCase())?'tak':v===false||['no','non','false'].includes(String(v).toLowerCase())?'nie':(v??'—');
const row=(l,v)=>'<div class="label">'+esc(l)+'</div><div class="value">'+esc(v)+'</div>';
const sourceLabel=x=>x.source_label||(x.source==='immotop'?'Immotop':x.source==='house_master_37'?'House Master 37':'atHome');
const cleanText=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const noisyProjectKey=k=>/^(multifamiliale a ete|lot \d+ dans|se situe a|se situe|integre des equipements|a ete)\b/.test(cleanText(k));
const numericId=x=>{const m=String(x.property_id||'').match(/(\d+)/);return m?Number(m[1]):null};
const cityOf=x=>cleanText(x.commute_city_proxy||x.city||x.location);
const typeOf=x=>{const t=cleanText(x.title);return t.includes('appartement')?'appartement':t.includes('maison')?'maison':t.includes('triplex')?'triplex':t.includes('duplex')?'duplex':''};
const near=(a,b,p)=>{a=Number(a);b=Number(b);return Number.isFinite(a)&&Number.isFinite(b)&&Math.abs(a-b)/Math.max(Math.abs(a),Math.abs(b),1)<=p};
const genericTitlePair=(a,b)=>{if(cityOf(a)!==cityOf(b)||!cityOf(a)||Number(a.bedrooms)!==Number(b.bedrooms)||a.source!==b.source)return false;const ia=numericId(a),ib=numericId(b);if(ia==null||ib==null||Math.abs(ia-ib)>5000)return false;const ta=String(a.title||'').trim().toLowerCase(),tb=String(b.title||'').trim().toLowerCase();return !!ta&&ta===tb&&/^(appartement|maison|duplex|triplex|penthouse)\b/.test(ta)};const likelyProjectPair=(a,b)=>{if(cityOf(a)!==cityOf(b)||!cityOf(a)||Number(a.bedrooms)!==Number(b.bedrooms)||a.source!==b.source)return false;const ia=numericId(a),ib=numericId(b);if(ia==null||ib==null||Math.abs(ia-ib)>5000)return false;const exact=near(a.price_eur,b.price_eur,.001)&&near(a.surface_m2,b.surface_m2,.001);return exact||genericTitlePair(a,b);
function eligible(x){const manualCashReview=Array.isArray(x.decision_reasons)&&x.decision_reasons.includes('manual_review_cash_slightly_over_budget');return x.status==='ACTIVE'&&x.decision_status==='ELIGIBLE'&&x.decision_eligible===true&&x.commute_within_35_min_both===true&&Number(x.monthly_total_eur)<=MONTHLY_LIMIT&&(manualCashReview||x.cash_required_eur==null||Number(x.cash_required_eur)<=CASH_LIMIT)&&!x.quality_signals?.sold&&!x.duplicate_of}
function effectiveScore(x){const base=x.manual_final_score!=null?Number(x.manual_final_score):Number(x.score);if(!Number.isFinite(base))return -Infinity;const penalty=x.under_construction?Number(x.construction_penalty_rate??UNDER_CONSTRUCTION_PENALTY):0;return base*(1-penalty)}
function scoreDisplay(x){const raw=x.manual_final_score!=null?Number(x.manual_final_score):Number(x.score);const eff=effectiveScore(x);if(x.under_construction)return num(eff)+' / 100 <span class="badge review">−20% BUILD</span><span class="meta"> (bazowy '+num(raw)+')</span>';return num(raw)+' / 100'}
function key(x){const k=x.project_key||x.development_group_key||x.development_key||null;return k&&!noisyProjectKey(k)?k:null}
function topAndDuplicates(){const base=data.filter(eligible),groups=new Map(),dup=new Set();base.forEach(x=>{const k=key(x);if(k){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}});for(const m of groups.values()){if(m.length<2)continue;const w=[...m].sort((a,b)=>effectiveScore(b)-effectiveScore(a))[0];m.forEach(x=>{if(x!==w)dup.add(String(x.property_id))})}for(let i=0;i<base.length;i++)for(let j=i+1;j<base.length;j++){const a=base[i],b=base[j];if(dup.has(String(a.property_id))||dup.has(String(b.property_id)))continue;if(genericTitlePair(a,b)){const w=effectiveScore(a)>=effectiveScore(b)?a:b,l=w===a?b:a;dup.add(String(l.property_id))}}return{top:base.filter(x=>!dup.has(String(x.property_id))),duplicateIds:dup}}
function statusLabel(x,isDup){return eligible(x)?'ELIGIBLE':(isDup||x.duplicate_of?'DUPLICATE':x.decision_status||'REJECTED')}
function reasons(x,isDup){const r=[];if(isDup)r.push('Duplikat projektu — w TOP pozostawiono najlepszy lokal.');if(x.duplicate_of)r.push('Duplikat — reprezentant: '+x.duplicate_of);if(x.quality_signals?.sold||x.status==='SOLD')r.push('SOLD / oferta nieaktywna.');if(x.under_construction)r.push('W budowie / termin realizacji wymaga dodatkowej oceny.');if(Number(x.monthly_total_eur)>MONTHLY_LIMIT)r.push('Finanse: '+euro(x.monthly_total_eur)+' / mies. > '+euro(MONTHLY_LIMIT)+'.');if(x.cash_required_eur!=null&&Number(x.cash_required_eur)>CASH_LIMIT)r.push('Gotówka: '+euro(x.cash_required_eur)+' > '+euro(CASH_LIMIT)+'.');if(Number(x.commute_cloche_d_or_peak_min)>COMMUTE_LIMIT)r.push('Bartek: '+num(x.commute_cloche_d_or_peak_min)+' min > '+COMMUTE_LIMIT+' min.');if(Number(x.commute_clearstream_peak_min)>COMMUTE_LIMIT)r.push('Natalia: '+num(x.commute_clearstream_peak_min)+' min > '+COMMUTE_LIMIT+' min.');(x.decision_reasons||[]).filter(v=>v&&v!=='not_affordable').forEach(v=>r.push(String(v).replaceAll('_',' ')));return r}
function facts(x){return '<div class="facts">'+[
row('Metraż',num(x.surface_m2)+' m²'),row('Pokoje',x.rooms??'—'),row('Sypialnie',x.bedrooms??'—'),row('Łazienki',x.bathrooms??'—'),row('Prysznice',x.shower_rooms??'—'),row('Toalety',x.separate_toilets??'—'),row('Piętro',x.floor??'—'),row('Winda',yes(x.elevator)),row('Rok budowy',x.year_built??'—'),row('Renowacja',x.renovation_year??x.renovated??'—'),row('Ogród',x.garden||'—'),row('Taras',x.terrace||'—'),row('Balkon',x.balcony||'—'),row('Piwnica / cellar',x.basement||x.cellar||'—'),row('Parking',x.parking_detail||'—'),row('Garaż',x.garage||'—'),row('Ekspozycja',x.exposure||'—')].join('')+'</div>'}
function tech(x){return '<div class="facts">'+[
row('Energia',x.energy_class||'—'),row('Izolacja',x.insulation_class||'—'),row('Ogrzewanie',x.heating||'—'),row('Pompa ciepła',yes(x.heat_pump)),row('Podłogówka',yes(x.underfloor_heating)),row('Solar',yes(x.solar)),row('W budowie',yes(x.under_construction)),row('Termin oddania',x.delivery_year??'—')].join('')+'</div>'}
function finance(x){return '<div class="facts">'+[
row('Cena',euro(x.price_eur)),row('Cena / m²',num(x.price_per_m2)+' €/m²'),row('All-in / m²',num(x.all_in_cost_per_m2_estimate_eur)+' €/m²'),row('Wkład własny',euro(x.down_payment_eur)),row('Kwota kredytu',euro(x.loan_amount_eur)),row('Rata kredytu',euro(x.monthly_mortgage_eur)),row('Charges',euro(x.charges_monthly_eur)+(x.charges_status==='estimated'?' · estimate':'')),row('Rata + charges',euro(x.monthly_total_eur)+(x.monthly_total_is_estimate?' · estimate':'')),row('Bufor miesięczny',euro(x.monthly_budget_remaining_eur)),row('Koszty transakcyjne',euro(x.acquisition_costs_estimate_eur)),row('Move-in / CAPEX',euro(x.move_in_cost_estimate_eur)),row('Gotówka potrzebna',euro(x.cash_required_eur)),row('Pozostaje z €250k',euro(x.cash_remaining_eur)),row('Affordability',x.affordability_status||'—')].join('')+'</div>'}
function commute(x){return '<div class="facts">'+[
row('Cloche d’Or',num(x.commute_cloche_d_or_peak_min)+' min'),row('Clearstream',num(x.commute_clearstream_peak_min)+' min'),row('Limit ≤35 min oba',x.commute_within_35_min_both?'tak':'nie'),row('Najbliższy przystanek',num(x.transit_nearest_stop_m)+' m'),row('Trasy w pobliżu',x.transit_routes_nearby??'—'),row('Direct Cloche d’Or',x.transit_direct_route_cloche_d_or==null?'—':x.transit_direct_route_cloche_d_or?'tak':'nie'),row('Direct Kirchberg',x.transit_direct_route_kirchberg==null?'—':x.transit_direct_route_kirchberg?'tak':'nie'),row('Transit bonus','+'+num(x.transit_bonus))].join('')+'</div>'}
function score(x){const c=x.score_components||{},names={value:'Value / cena',size:'Metraż',energy:'Energetyka',outdoor:'Outdoor',parking:'Parking',building:'Budynek',features:'Funkcjonalność',commute:'Commute',commute_bonus:'Commute bonus',transit_bonus:'Transit bonus'};const ks=Object.keys(c);return ks.length?'<div class="facts">'+ks.map(k=>row(names[k]||k,num(c[k]))).join('')+'</div>':'<div class="meta">Brak rozpisanego automatycznego scorecardu.</div>'}
function card(x,i,rejected,isDup){const status=statusLabel(x,isDup),rs=reasons(x,isDup),note=x.manual_notes||x.user_feedback?.notes||'Brak dodatkowej ręcznej notatki.';const manualQuality=x.manual_quality_score!=null?'<div class="reason"><b>Ręczna ocena jakości:</b> '+esc(x.manual_quality_score)+' / '+esc(x.manual_quality_score_max||100)+(x.score_override?' <span class="badge">OVERRIDE</span>':'')+'</div>':'';const originalScore=x.original_auto_score!=null?'<div class="reason"><b>Oryginalna ocena automatyczna:</b> '+esc(x.original_auto_score)+' / 100</div>':'';const constructionFlag=x.under_construction?'<div class="reason"><b>⚑ Kara za inwestycję w budowie:</b> −'+num((x.construction_penalty_rate??UNDER_CONSTRUCTION_PENALTY)*100)+'%. Bazowy score '+num(x.manual_final_score??x.score)+' → ranking '+num(effectiveScore(x))+'/100.</div>':'';const scoreFlag=x.manual_final_score!=null?'<div class="reason"><b>⚑ Ręczna korekta rankingu:</b> '+esc(x.manual_final_score)+'/100 <span class="muted">(oryginalna ocena automatyczna: '+esc(x.auto_score??'—')+'/100)</span></div>':'';const nex=x.nexvia_estimate_eur!=null?'<div class="section"><h3>Wycena Nexvia</h3><div class="facts">'+row('Wycena',euro(x.nexvia_estimate_eur))+row('Różnica vs asking',euro(x.price_eur-x.nexvia_estimate_eur))+'</div></div>':'';return '<details class="property"><summary><div class="row"><span class="rank">'+(i+1)+'</span><span><div class="name">'+esc((x.title||'').replace('▷ ','').replace(' | atHome',''))+'</div><div class="score">'+scoreDisplay(x)+' <span class="badge '+(status==='ELIGIBLE'?'good':status==='ELIGIBLE_D_REVIEW'?'review':'bad')+'">'+esc(status)+'</span></div><div class="meta">'+esc(x.commute_city_proxy||x.location||'—')+' · '+esc(sourceLabel(x))+' · ID '+esc(x.property_id)+'</div><div class="expand">Pełne dane</div></span><span class="price"><div class="asking">'+euro(x.price_eur)+'</div><div class="monthly">'+euro(x.monthly_total_eur)+'/m</div></span></div></summary><div class="panel"><div class="grid"><div class="section full"><h3>Ocena / notatki</h3><div class="note">'+esc(note)+'</div></div>'+manualQuality+originalScore+scoreFlag+constructionFlag+(rs.length?'<div class="reason '+(rejected?'badbox':'')+'"><b>Dlaczego '+(rejected?'nie jest w TOP':'istotne uwagi')+':</b><br>'+rs.map(v=>'• '+esc(v)).join('<br>')+'</div>':'')+'<div class="section"><h3>Najważniejsze dane</h3>'+facts(x)+'</div><div class="section"><h3>Energia / technika</h3>'+tech(x)+'</div><div class="section"><h3>Finansowanie</h3>'+finance(x)+'</div><div class="section"><h3>Dojazd / transport</h3>'+commute(x)+'</div><div class="section"><h3>Scorecard · ranking '+num(effectiveScore(x))+'/100</h3>'+score(x)+'</div>'+nex+'<div class="section"><h3>Status / historia</h3><div class="facts">'+row('Status',x.status||'—')+row('First seen',x.first_seen||'—')+row('Cena poprzednia',euro(x.previous_price_eur))+row('Zmiana ceny',euro(x.price_change_eur))+row('Projekt',x.development_name||x.quality_signals?.project_name||'—')+row('Duplikaty projektu',x.development_duplicate_count??'—')+'</div></div></div><a class="link" href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">Otwórz ofertę '+esc(sourceLabel(x))+' ↗</a></div></details>'}
function filtered(){const {top,duplicateIds}=topAndDuplicates();let rows=tab==='top'?top:tab==='baseline'?baselineData:data.filter(x=>!top.some(t=>String(t.property_id)===String(x.property_id)));const q=document.getElementById('q').value.toLowerCase().trim(),src=document.getElementById('source').value,en=document.getElementById('energy').value,sort=document.getElementById('sort').value;rows=rows.filter(x=>(src==='ALL'||(x.source||'athome')===src)&&(en==='ALL'||x.energy_class===en)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));rows.sort((a,b)=>tab==='baseline'?Number(a.legacy_rank||999)-Number(b.legacy_rank||999):sort==='price'?Number(a.price_eur||1e12)-Number(b.price_eur||1e12):sort==='value'?Number(a.all_in_cost_per_m2_estimate_eur||1e12)-Number(b.all_in_cost_per_m2_estimate_eur||1e12):sort==='monthly'?Number(a.monthly_total_eur||1e12)-Number(b.monthly_total_eur||1e12):sort==='cash'?Number(a.cash_required_eur||1e12)-Number(b.cash_required_eur||1e12):effectiveScore(b)-effectiveScore(a));return{rows,duplicateIds}}
function render(){const {rows,duplicateIds}=filtered();document.getElementById('cards').innerHTML=rows.length?rows.map((x,i)=>card(x,tab==='baseline'?(x.legacy_rank==='WATCHLIST'?i:x.legacy_rank-1):i,tab==='rejected'||tab==='baseline',duplicateIds.has(String(x.property_id)))).join(''):'<div class="empty">Brak ofert.</div>';document.getElementById('topTab').classList.toggle('active',tab==='top');document.getElementById('rejectTab').classList.toggle('active',tab==='rejected');document.getElementById('baselineTab').classList.toggle('active',tab==='baseline')}
function kpis(){const {top}=topAndDuplicates(),rej=data.filter(x=>!top.some(t=>String(t.property_id)===String(x.property_id))),ath=data.filter(x=>(x.source||'athome')==='athome').length,imm=data.filter(x=>x.source==='immotop').length;document.getElementById('kpis').innerHTML=[['Oferty',data.length],['TOP',top.length],['atHome',ath],['Immotop',imm],['House Master 37',baselineData.length],['Odrzucone / duplikaty',rej.length]].map(v=>'<div class="kpi"><div class="n">'+v[1]+'</div><div class="l">'+v[0]+'</div></div>').join('')}
async function init(){try{const t=Date.now();const c=await fetch('data/config.json?'+t);if(!c.ok)throw Error('CONFIG HTTP '+c.status);CONFIG=await c.json();MONTHLY_LIMIT=Number(CONFIG.financial.monthly_budget_eur);CASH_LIMIT=Number(CONFIG.financial.cash_budget_eur);COMMUTE_LIMIT=Number(CONFIG.commute.max_minutes);UNDER_CONSTRUCTION_PENALTY=Number(CONFIG.decision?.under_construction_penalty_rate??0.20);document.getElementById('rules').innerHTML='<b>Twarde ograniczenia:</b> '+euro(MONTHLY_LIMIT)+'/mies. · '+euro(CASH_LIMIT)+' gotówki · ≤'+COMMUTE_LIMIT+' min do '+esc(CONFIG.commute.workplaces.bartek)+' i '+esc(CONFIG.commute.workplaces.natalia)+'. Najpierw eliminacja, potem ranking. Inwestycje w budowie pozostają w rankingu z karą −20%. Jeden projekt = jeden najlepszy lokal.';const [a,m,b]=await Promise.all([fetch('data/listings.json?'+t),fetch('data/manual_immotop_listings.json?'+t),fetch('data/manual_house_master_37_baseline.json?'+t)]);if(!a.ok)throw Error('atHome DATA HTTP '+a.status);const aa=await a.json(),mm=m.ok?await m.json():[],bb=b.ok?await b.json():[];data=[...aa,...mm];baselineData=bb;document.getElementById('loading').remove();kpis();render()}catch(e){document.getElementById('loading').textContent='Nie udało się załadować danych: '+e.message}}
document.getElementById('topTab').onclick=()=>{tab='top';render()};document.getElementById('rejectTab').onclick=()=>{tab='rejected';render()};document.getElementById('baselineTab').onclick=()=>{tab='baseline';render()};['q','source','energy','sort'].forEach(id=>{const el=document.getElementById(id);el.oninput=render;el.onchange=render});init();
</script>
</body></html>
