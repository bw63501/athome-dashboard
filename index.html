<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House Master — Decision Dashboard</title><style>body{margin:0;background:#171d27;color:#eef0f3;font:14px system-ui,sans-serif;background-image:linear-gradient(#1c2330 1px,transparent 1px),linear-gradient(90deg,#1c2330 1px,transparent 1px);background-size:28px 28px}header{padding:25px 18px 16px;border-bottom:1px solid #303c50;background:#171d27}main{max-width:760px;margin:auto;padding:12px}.eyebrow{font:11px monospace;letter-spacing:.16em;color:#c9a24a;text-transform:uppercase}h1{font:28px Georgia,serif;margin:0 0 5px}.sub,.small,.meta{color:#96a1b3;font-size:11px}.rules,.market,.card{background:#202939;border:1px solid #303c50;border-radius:10px}.rules,.market{padding:11px 13px;margin-bottom:11px;font-size:11px;line-height:1.5}.rules{border-color:#8a733a}.rules b{color:#c9a24a}.market a{color:#c9a24a;text-decoration:none;font-weight:700}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:11px}.kpi{padding:9px}.kpi .n{font:17px monospace;color:#c9a24a}.kpi .l{font-size:9px;color:#96a1b3;text-transform:uppercase}.tabs{display:flex;gap:7px;margin-bottom:11px}.tab{flex:1;padding:10px;background:#202939;color:#96a1b3;border:1px solid #303c50;border-radius:7px;font:11px monospace}.tab.active{background:#c9a24a;color:#171d27}.filters{display:flex;gap:7px;margin-bottom:11px}.filters input,.filters select{min-width:0;flex:1;background:#202939;color:#eef0f3;border:1px solid #303c50;border-radius:7px;padding:9px;font:11px monospace}.card{margin-bottom:10px;overflow:hidden}.row{display:grid;grid-template-columns:36px minmax(0,1fr) 92px 58px;gap:9px;align-items:center;padding:12px;cursor:pointer}.rank{width:30px;height:30px;border:1px solid #8a733a;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#c9a24a;font:11px monospace}.name{font:15px Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font:10px monospace;color:#c9a24a;margin-top:3px}.price{text-align:right;font:12px monospace}.asking{font-size:14px;font-weight:700}.area{text-align:right;color:#96a1b3;font:11px monospace}.badge{display:inline-block;border-radius:999px;padding:3px 7px;font:9px monospace;margin-left:4px}.good{border:1px solid #6fae82;color:#76d69b}.bad{border:1px solid #b97878;color:#e08b84}.panel{padding:12px 13px 14px;border-top:1px dashed #303c50}.box{padding:10px;border-radius:7px;font-size:11.5px;line-height:1.5;margin-bottom:9px}.rejectbox{background:rgba(185,120,120,.08);border:1px solid rgba(185,120,120,.35);color:#f0b0a8}.info{background:rgba(201,162,74,.06);border:1px solid rgba(201,162,74,.2)}.link{display:block;padding:10px;border-radius:7px;background:#c9a24a;color:#171d27;text-decoration:none;font:600 11px monospace;text-align:center}.empty{padding:20px;text-align:center;color:#96a1b3}@media(max-width:560px){.row{grid-template-columns:34px minmax(0,1fr) 86px}.area{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.filters{flex-direction:column}}</style></head><body><header><div class="eyebrow">Dossier — Luksemburg</div><h1>House Master</h1><div class="sub">Independent IC Review · live atHome pipeline · owner feedback · Nexvia · decision scorecard · config v<span id="version">—</span></div></header><main><div id="rules" class="rules"><b>Ładowanie konfiguracji…</b></div><div class="market"><a href="https://www.athome.lu/" target="_blank">atHome</a> · <a href="https://www.immotop.lu/" target="_blank">immotop</a> ↗</div><div id="kpis" class="kpis"></div><div class="tabs"><button id="topTab" class="tab active">1 · TOP</button><button id="rejectTab" class="tab">2 · ODRZUCONE / DUPLIKATY</button></div><div class="filters"><input id="q" placeholder="Szukaj lokalizacji / tytułu / ID…"><select id="sort"><option value="score">Score ↓</option><option value="price">Cena ↑</option><option value="value">All-in €/m² ↑</option><option value="monthly">Rata + charges ↑</option></select></div><div id="loading" class="card"><div class="panel">Ładowanie danych…</div></div><div id="cards"></div></main><script>
let CONFIG=null,data=[],tab='top',MONTHLY_LIMIT=Infinity,CASH_LIMIT=Infinity,COMMUTE_LIMIT=Infinity;
const euro=n=>n==null?'—':new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Number(n));const num=n=>n==null?'—':Number(n).toLocaleString('fr-FR',{maximumFractionDigits:1});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function eligible(x){return x.status==='ACTIVE'&&x.decision_status==='ELIGIBLE'&&x.decision_eligible===true&&x.commute_within_35_min_both===true&&Number(x.monthly_total_eur)<=MONTHLY_LIMIT&&Number(x.cash_required_eur)<=CASH_LIMIT&&!x.quality_signals?.sold&&!x.under_construction&&!x.duplicate_of}
function key(x){return x.project_key||x.development_group_key||x.development_key||null}
function topAndDuplicates(){const base=data.filter(eligible),groups=new Map();base.forEach(x=>{const k=key(x);if(k){if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}});const duplicateIds=new Set();for(const members of groups.values()){if(members.length<2)continue;const winner=[...members].sort((a,b)=>(Number(b.score)||-1)-(Number(a.score)||-1))[0];members.forEach(x=>{if(x!==winner)duplicateIds.add(String(x.property_id))})}return {top:base.filter(x=>!duplicateIds.has(String(x.property_id))),duplicateIds}}
function reasons(x,isDup){const r=[];if(isDup)r.push('Duplikat projektu — w TOP pozostawiono najlepszy lokal.');if(x.duplicate_of)r.push('Duplikat — reprezentant: '+x.duplicate_of);if(x.quality_signals?.sold||x.status==='SOLD')r.push('SOLD / oferta nieaktywna.');if(x.under_construction)r.push('W budowie / oferta z terminem realizacji.');if(Number(x.monthly_total_eur)>MONTHLY_LIMIT)r.push('Finanse: '+euro(x.monthly_total_eur)+' / mies. > '+euro(MONTHLY_LIMIT)+'.');if(Number(x.cash_required_eur)>CASH_LIMIT)r.push('Gotówka: '+euro(x.cash_required_eur)+' > '+euro(CASH_LIMIT)+'.');if(Number(x.commute_cloche_d_or_peak_min)>COMMUTE_LIMIT)r.push('Bartek: '+num(x.commute_cloche_d_or_peak_min)+' min > '+COMMUTE_LIMIT+' min.');if(Number(x.commute_clearstream_peak_min)>COMMUTE_LIMIT)r.push('Natalia: '+num(x.commute_clearstream_peak_min)+' min > '+COMMUTE_LIMIT+' min.');if(Array.isArray(x.decision_reasons))x.decision_reasons.filter(v=>v&&v!=='not_affordable').forEach(v=>r.push(String(v)));if(!r.length&&x.decision_status!=='ELIGIBLE')r.push(x.decision_status||'Nie spełnia kryteriów.');return r}
function card(x,i,rejected,isDup){const status=eligible(x)?'ELIGIBLE':(isDup||x.duplicate_of?'DUPLICATE':(x.decision_status||'REJECTED'));const reasonsList=reasons(x,isDup);return '<details class="card"><summary class="row"><span class="rank">'+(i+1)+'</span><span><div class="name">'+esc((x.title||'').replace('▷ ','').replace(' | atHome',''))+'</div><div class="score">'+num(x.score)+' / 100 <span class="badge '+(status==='ELIGIBLE'?'good':'bad')+'">'+status+'</span></div><div class="meta">'+esc(x.commute_city_proxy||'')+' · ID '+esc(x.property_id)+'</div></span><span class="price"><span class="asking">'+euro(x.price_eur)+'</span><span class="small">'+euro(x.monthly_mortgage_eur)+' rata</span></span><span class="area">'+num(x.surface_m2)+' m²</span></summary><div class="panel"><div class="info"><b>Finance</b><br>'+euro(x.monthly_total_eur)+' / mies. · '+euro(x.cash_required_eur)+' cash required<br>Commute: '+num(x.commute_cloche_d_or_peak_min)+' / '+num(x.commute_clearstream_peak_min)+' min<br>Energy: '+esc(x.energy_class||'—')+'</div>'+(rejected?'<div class="box rejectbox"><b>Dlaczego nie jest w TOP:</b><br>'+reasonsList.map(v=>'• '+esc(v)).join('<br>')+'</div>':'')+'<a class="link" href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">Otwórz ofertę atHome ↗</a></div></details>'}
function render(){const {top,duplicateIds}=topAndDuplicates();let rows=tab==='top'?top:data.filter(x=>!top.some(t=>String(t.property_id)===String(x.property_id)));const q=document.getElementById('q').value.toLowerCase().trim(),sort=document.getElementById('sort').value;rows=rows.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));rows.sort((a,b)=>sort==='price'?Number(a.price_eur)-Number(b.price_eur):sort==='value'?Number(a.all_in_cost_per_m2_estimate_eur||999999)-Number(b.all_in_cost_per_m2_estimate_eur||999999):sort==='monthly'?Number(a.monthly_total_eur||999999)-Number(b.monthly_total_eur||999999):(Number(b.score)||-1)-(Number(a.score)||-1));document.getElementById('cards').innerHTML=rows.length?rows.map((x,i)=>card(x,i,tab==='rejected',duplicateIds.has(String(x.property_id)))).join(''):'<div class="card empty">Brak ofert.</div>';document.getElementById('topTab').classList.toggle('active',tab==='top');document.getElementById('rejectTab').classList.toggle('active',tab==='rejected')}
function kpis(){const {top}=topAndDuplicates();const rejected=data.filter(x=>!top.some(t=>String(t.property_id)===String(x.property_id)));document.getElementById('kpis').innerHTML=[['Oferty',data.length],['TOP',top.length],['Odrzucone / duplikaty',rejected.length],['Limit',euro(MONTHLY_LIMIT)+'/m']].map(v=>'<div class="card kpi"><div class="n">'+v[1]+'</div><div class="l">'+v[0]+'</div></div>').join('')}
async function init(){try{const c=await fetch('data/config.json?'+Date.now());if(!c.ok)throw Error('CONFIG HTTP '+c.status);CONFIG=await c.json();MONTHLY_LIMIT=Number(CONFIG.financial.monthly_budget_eur);CASH_LIMIT=Number(CONFIG.financial.cash_budget_eur);COMMUTE_LIMIT=Number(CONFIG.commute.max_minutes);document.getElementById('version').textContent=CONFIG.schema_version;document.getElementById('rules').innerHTML='<b>Twarde ograniczenia:</b> '+euro(MONTHLY_LIMIT)+'/mies. · '+euro(CASH_LIMIT)+' gotówki · ≤'+COMMUTE_LIMIT+' min do '+esc(CONFIG.commute.workplaces.bartek)+' i '+esc(CONFIG.commute.workplaces.natalia)+'. Najpierw eliminacja, dopiero potem ranking. <b>Jeden projekt = jeden najlepszy lokal.</b>';const r=await fetch('data/listings.json?'+Date.now());if(!r.ok)throw Error('DATA HTTP '+r.status);data=await r.json();document.getElementById('loading').remove();kpis();render()}catch(e){document.getElementById('loading').innerHTML='<div class="panel"><b>Nie udało się załadować danych.</b><br>'+esc(e.message)+'</div>'}}
document.getElementById('topTab').onclick=()=>{tab='top';render()};document.getElementById('rejectTab').onclick=()=>{tab='rejected';render()};['q','sort'].forEach(id=>document.getElementById(id).oninput=render);init();
</script></body></html>
